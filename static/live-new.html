<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kunden-Chat - Tali Service Agent</title>
    <style>
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #141b3d;
            --bg-card: #1a2347;
            --accent-primary: #00d4ff;
            --accent-secondary: #7B68EE;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --border-color: #2d3748;
            --success: #48bb78;
            --user-msg-bg: linear-gradient(135deg, #00d4ff, #7B68EE);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--bg-secondary);
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.3rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            padding: 0.4rem 0.8rem;
            background: rgba(72, 187, 120, 0.2);
            border: 1px solid var(--success);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--success);
        }

        .top-bar {
            background: var(--bg-secondary);
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 1rem;
            align-items: center;
        }

        .compact-select {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .compact-select:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .compact-select:hover {
            border-color: var(--accent-primary);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-small {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }

        .main-content {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 70%;
            padding: 0.875rem 1.125rem;
            border-radius: 12px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg-bg);
            color: white;
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
        }

        .message.assistant strong {
            color: var(--accent-primary);
        }

        .message.assistant ul {
            margin: 0.5rem 0;
            padding-left: 1.5rem;
        }

        .message.assistant li {
            margin: 0.25rem 0;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .typing-indicator {
            display: none;
            padding: 0.75rem 1.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .typing-indicator.active {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-primary);
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        .input-area {
            border-top: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            background: var(--bg-card);
        }

        .input-group {
            display: flex;
            gap: 0.75rem;
        }

        textarea {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem;
            border-radius: 8px;
            resize: none;
            font-family: inherit;
            font-size: 0.95rem;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .sidebar {
            width: 300px;
            background: var(--bg-secondary);
            padding: 1rem;
            overflow-y: auto;
            border-left: 1px solid var(--border-color);
        }

        .sidebar h3 {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            letter-spacing: 0.5px;
        }

        .info-card {
            background: var(--bg-card);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 0.5rem 0;
            font-size: 0.9rem;
        }

        .info-label {
            color: var(--text-secondary);
        }

        .info-value {
            color: var(--text-primary);
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .top-bar {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                display: none;
            }
            
            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 Kunden-Chat</h1>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <div class="status-badge" id="statusBadge">✅ Online</div>
                <button class="btn btn-small" onclick="window.location.href='index.html'">🏠 Dashboard</button>
            </div>
        </div>

        <div class="top-bar">
            <select class="compact-select" id="customerSelect">
                <option value="">⏳ Lade Kunden...</option>
            </select>
            
            <select class="compact-select" id="sessionSelect" disabled>
                <option value="">Erst Kunde wählen...</option>
            </select>
            
            <button class="btn" id="newSessionBtn" disabled onclick="createNewSession()">
                ➕ Neuer Auftrag
            </button>
        </div>

        <div class="main-content">
            <div class="chat-container">
                <div class="messages" id="messages">
                    <div class="loading">👋 Wähle einen Kunden um zu starten</div>
                </div>

                <div class="typing-indicator" id="typingIndicator">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span>AI denkt nach...</span>
                </div>

                <div class="input-area">
                    <div class="input-group">
                        <textarea 
                            id="messageInput" 
                            placeholder="Schreibe deine Nachricht... (Enter zum Senden, Shift+Enter für neue Zeile)"
                            rows="3"
                            disabled
                        ></textarea>
                        <button class="btn" id="sendBtn" disabled onclick="sendMessage()">
                            📤 Senden
                        </button>
                    </div>
                </div>
            </div>

            <div class="sidebar">
                <h3>ℹ️ Kunden-Info</h3>
                <div class="info-card" id="customerInfo" style="display: none;">
                    <div class="info-row">
                        <span class="info-label">Name:</span>
                        <span class="info-value" id="infoName">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Email:</span>
                        <span class="info-value" id="infoEmail">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Typ:</span>
                        <span class="info-value" id="infoType">-</span>
                    </div>
                </div>

                <h3>📋 Aktueller Auftrag</h3>
                <div class="info-card" id="sessionInfo" style="display: none;">
                    <div class="info-row">
                        <span class="info-label">Titel:</span>
                        <span class="info-value" id="infoSessionTitle">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Erstellt:</span>
                        <span class="info-value" id="infoSessionDate">-</span>
                    </div>
                </div>

                <h3>⚡ Schnellaktionen</h3>
                <button class="btn" style="width: 100%; margin-bottom: 0.5rem;" onclick="window.location.href='general-chat.html'">
                    🤖 Allgemein-Chat
                </button>
                <button class="btn" style="width: 100%; margin-bottom: 0.5rem;" onclick="window.location.href='new-customer.html'">
                    ➕ Neuer Kunde
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let currentCustomerId = null;
        let currentSessionId = null;
        let currentCustomer = null;
        let CUSTOMERS = {};
        let SESSIONS = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await loadCustomers();
            setupEventListeners();
        });

        async function loadCustomers() {
            try {
                const response = await fetch(`${API_URL}/customers`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const customers = await response.json();
                const select = document.getElementById("customerSelect");
                
                select.innerHTML = '<option value="">-- Kunde wählen --</option>';
                
                if (customers.length === 0) {
                    select.innerHTML += '<option disabled>⚠️ Keine Kunden - synchronisieren!</option>';
                } else {
                    customers.forEach(customer => {
                        CUSTOMERS[customer.id] = customer;
                        const option = document.createElement('option');
                        option.value = customer.id;
                        option.textContent = `${customer.name}`;
                        select.appendChild(option);
                    });
                }
                
                document.getElementById('statusBadge').innerHTML = `✅ ${customers.length} Kunden`;
                
            } catch (e) {
                console.error("Fehler beim Laden:", e);
                document.getElementById('statusBadge').innerHTML = '❌ Offline';
            }
        }

        function setupEventListeners() {
            document.getElementById('customerSelect').addEventListener('change', async function() {
                const customerId = this.value;
                
                if (!customerId) {
                    resetUI();
                    return;
                }
                
                const customer = CUSTOMERS[customerId];
                currentCustomerId = customer.id;
                currentCustomer = customer;
                
                updateCustomerInfo(customer);
                await loadCustomerSessions(customer.id);
                
                document.getElementById('sessionSelect').disabled = false;
                document.getElementById('newSessionBtn').disabled = false;
            });

            document.getElementById('sessionSelect').addEventListener('change', async function() {
                const sessionId = this.value;
                if (sessionId) {
                    currentSessionId = parseInt(sessionId);
                    await loadMessages(currentSessionId);
                    updateSessionInfo();
                    document.getElementById('messageInput').disabled = false;
                    document.getElementById('sendBtn').disabled = false;
                }
            });

            document.getElementById('messageInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        }

        function resetUI() {
            document.getElementById('customerInfo').style.display = 'none';
            document.getElementById('sessionInfo').style.display = 'none';
            document.getElementById('sessionSelect').disabled = true;
            document.getElementById('sessionSelect').innerHTML = '<option value="">Erst Kunde wählen...</option>';
            document.getElementById('newSessionBtn').disabled = true;
            document.getElementById('messageInput').disabled = true;
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('messages').innerHTML = '<div class="loading">👋 Wähle einen Kunden um zu starten</div>';
        }

        function updateCustomerInfo(customer) {
            document.getElementById('infoName').textContent = customer.name;
            document.getElementById('infoEmail').textContent = customer.email || '-';
            document.getElementById('infoType').textContent = customer.customer_type === 'gewerbe' ? '🏢 Gewerbe' : '👤 Privat';
            document.getElementById('customerInfo').style.display = 'block';
        }

        function updateSessionInfo() {
            const session = SESSIONS.find(s => s.id === currentSessionId);
            if (session) {
                document.getElementById('infoSessionTitle').textContent = session.title || `Auftrag #${session.id}`;
                document.getElementById('infoSessionDate').textContent = new Date(session.created_at).toLocaleDateString('de-DE');
                document.getElementById('sessionInfo').style.display = 'block';
            }
        }

        async function loadCustomerSessions(customerId) {
            try {
                const res = await fetch(`${API_URL}/chat/customer/${customerId}/sessions`);
                SESSIONS = await res.json();
                
                const select = document.getElementById('sessionSelect');
                select.innerHTML = '<option value="">-- Auftrag wählen --</option>';
                
                if (SESSIONS.length > 0) {
                    SESSIONS.forEach(session => {
                        const option = document.createElement('option');
                        option.value = session.id;
                        option.textContent = session.title || `Auftrag #${session.id}`;
                        select.appendChild(option);
                    });
                    
                    select.value = SESSIONS[0].id;
                    currentSessionId = SESSIONS[0].id;
                    await loadMessages(currentSessionId);
                    updateSessionInfo();
                    document.getElementById('messageInput').disabled = false;
                    document.getElementById('sendBtn').disabled = false;
                } else {
                    document.getElementById('messages').innerHTML = '<div class="loading">➕ Klicke "Neuer Auftrag"</div>';
                }
            } catch (e) {
                console.error("Fehler beim Laden der Sessions:", e);
            }
        }

        async function createNewSession() {
            if (!currentCustomerId) {
                alert("⚠️ Bitte erst einen Kunden auswählen!");
                return;
            }
            
            const title = prompt("Name für den neuen Auftrag:", `Auftrag ${new Date().toLocaleDateString('de-DE')}`);
            if (!title) return;
            
            try {
                const res = await fetch(`${API_URL}/chat/sessions`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        customer_id: currentCustomerId, 
                        title: title,
                        topic: "Elektroauftrag"
                    })
                });
                
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                const session = await res.json();
                await loadCustomerSessions(currentCustomerId);
                
                document.getElementById('sessionSelect').value = session.id;
                currentSessionId = session.id;
                
                document.getElementById('messages').innerHTML = `<div class="loading">✨ Neuer Auftrag "${title}" erstellt!</div>`;
                updateSessionInfo();
                document.getElementById('messageInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
            } catch (e) {
                alert("Fehler beim Erstellen: " + e.message);
            }
        }

        async function loadMessages(sessionId) {
            try {
                const res = await fetch(`${API_URL}/chat/sessions/${sessionId}/messages`);
                const messages = await res.json();
                
                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML = "";
                
                messages.forEach(msg => {
                    addMessageToUI(msg.role, msg.content);
                });
                
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            } catch (e) {
                console.error("Konnte Nachrichten nicht laden:", e);
            }
        }

        function addMessageToUI(role, content) {
            const messagesDiv = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            if (role === 'assistant') {
                let formatted = content
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/^•\s(.*)$/gm, '<li>$1</li>')
                    .replace(/\n/g, '<br>');
                
                if (formatted.includes('<li>')) {
                    formatted = formatted.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
                }
                
                div.innerHTML = formatted;
            } else {
                div.textContent = content;
            }
            
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function sendMessage() {
            const textarea = document.getElementById('messageInput');
            const text = textarea.value.trim();
            
            if (!text) return;
            
            addMessageToUI('user', text);
            textarea.value = '';
            
            document.getElementById('typingIndicator').classList.add('active');
            document.getElementById('sendBtn').disabled = true;
            
            try {
                const response = await fetch(`${API_URL}/chat/messages`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        session_id: currentSessionId,
                        content: text
                    })
                });
                
                document.getElementById('typingIndicator').classList.remove('active');
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                addMessageToUI('assistant', data.content);
                
            } catch (e) {
                document.getElementById('typingIndicator').classList.remove('active');
                addMessageToUI('assistant', '⚠️ Fehler: Server nicht erreichbar');
            }
            
            document.getElementById('sendBtn').disabled = false;
        }
    </script>
</body>
</html>
