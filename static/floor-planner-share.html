<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ihre Elektroplanung - Tali Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #e91e63;
        }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }
        
        .app-header {
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .app-header h1 {
            font-size: 1.3rem;
            margin: 0;
        }
        
        .main-container {
            display: flex;
            height: calc(100vh - 60px);
        }
        
        .canvas-area {
            flex: 1;
            background: #1a1a2e;
            position: relative;
            overflow: hidden;
        }
        
        #floorCanvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .sidebar {
            width: 280px;
            background: white;
            border-left: 1px solid #ddd;
            overflow-y: auto;
        }
        
        .sidebar h5 {
            background: #f8f9fa;
            padding: 12px 15px;
            margin: 0;
            border-bottom: 1px solid #ddd;
            font-size: 0.95rem;
        }
        
        .element-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            padding: 15px;
        }
        
        .element-btn {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .element-btn:hover {
            background: #e91e63;
            color: white;
            border-color: #e91e63;
        }
        
        .element-btn.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        
        .element-btn i {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 5px;
        }
        
        .element-btn span {
            font-size: 0.75rem;
        }
        
        .info-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin: 15px;
        }
        
        .info-box h6 {
            margin: 0 0 10px;
            color: #856404;
        }
        
        .info-box p {
            margin: 0;
            font-size: 0.85rem;
            color: #856404;
        }
        
        .zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .zoom-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: white;
            border: 1px solid #ddd;
            cursor: pointer;
        }
        
        .zoom-btn:hover {
            background: #e91e63;
            color: white;
        }
        
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
        }
        
        .submit-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            margin-top: 15px;
        }
        
        .submit-btn:hover {
            background: #218838;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            flex-direction: column;
        }
        
        .error-message {
            text-align: center;
            padding: 50px;
        }
        
        .error-message i {
            font-size: 4rem;
            color: #dc3545;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- Loading -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-light mb-3" style="width:3rem;height:3rem;"></div>
        <p>Elektroplanung wird geladen...</p>
    </div>
    
    <!-- Header -->
    <header class="app-header">
        <div>
            <h1><i class="bi bi-lightning-charge-fill me-2"></i>Ihre Elektroplanung</h1>
            <small id="projectInfo">Wird geladen...</small>
        </div>
        <div>
            <span class="badge bg-light text-dark" id="elementCount">0 Elemente</span>
        </div>
    </header>
    
    <div class="main-container">
        <!-- Canvas -->
        <div class="canvas-area">
            <canvas id="floorCanvas"></canvas>
            
            <div class="zoom-controls">
                <button class="zoom-btn" onclick="zoomIn()"><i class="bi bi-zoom-in"></i></button>
                <button class="zoom-btn" onclick="zoomOut()"><i class="bi bi-zoom-out"></i></button>
                <button class="zoom-btn" onclick="zoomFit()"><i class="bi bi-arrows-fullscreen"></i></button>
            </div>
        </div>
        
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="info-box">
                <h6><i class="bi bi-info-circle me-2"></i>Hinweis</h6>
                <p>Fügen Sie hier Ihre gewünschten Steckdosen, Schalter und Lampen hinzu. Klicken Sie auf ein Element und dann auf den Plan.</p>
            </div>
            
            <h5><i class="bi bi-plug me-2"></i>Steckdosen</h5>
            <div class="element-grid" id="steckdosenGrid">
                <div class="element-btn" data-type="steckdose_schuko">
                    <i class="bi bi-outlet"></i>
                    <span>Steckdose</span>
                </div>
                <div class="element-btn" data-type="steckdose_doppelt">
                    <i class="bi bi-outlet"></i>
                    <span>Doppelt</span>
                </div>
            </div>
            
            <h5><i class="bi bi-toggle-on me-2"></i>Schalter</h5>
            <div class="element-grid" id="schalterGrid">
                <div class="element-btn" data-type="schalter_aus">
                    <i class="bi bi-toggle-off"></i>
                    <span>Ausschalter</span>
                </div>
                <div class="element-btn" data-type="schalter_wechsel">
                    <i class="bi bi-toggle2-on"></i>
                    <span>Wechsel</span>
                </div>
            </div>
            
            <h5><i class="bi bi-lightbulb me-2"></i>Beleuchtung</h5>
            <div class="element-grid" id="lichtGrid">
                <div class="element-btn" data-type="licht_decke">
                    <i class="bi bi-lightbulb"></i>
                    <span>Decke</span>
                </div>
                <div class="element-btn" data-type="licht_wand">
                    <i class="bi bi-lamp"></i>
                    <span>Wand</span>
                </div>
            </div>
            
            <div style="padding: 15px;">
                <button class="submit-btn" onclick="submitChanges()">
                    <i class="bi bi-check-circle me-2"></i>Änderungen speichern
                </button>
            </div>
        </div>
    </div>
    
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // State
        const state = {
            shareToken: null,
            project: null,
            floor: null,
            elements: [],
            rooms: [],
            permissions: {},
            zoom: 1,
            panX: 0,
            panY: 0,
            floorPlanImage: null,
            selectedType: null,
            isDragging: false
        };
        
        const canvas = document.getElementById('floorCanvas');
        const ctx = canvas.getContext('2d');
        
        const SYMBOL_SIZE = 36;
        
        const ELEMENT_CONFIG = {
            steckdose_schuko: { name: 'Steckdose', color: '#000' },
            steckdose_doppelt: { name: 'Doppelsteckdose', color: '#000' },
            schalter_aus: { name: 'Ausschalter', color: '#000' },
            schalter_wechsel: { name: 'Wechselschalter', color: '#000' },
            licht_decke: { name: 'Deckenlampe', color: '#000' },
            licht_wand: { name: 'Wandlampe', color: '#000' }
        };
        
        // Initialize
        async function init() {
            // Get share token from URL
            const params = new URLSearchParams(window.location.search);
            state.shareToken = params.get('token');
            
            if (!state.shareToken) {
                showError('Kein gültiger Freigabe-Link');
                return;
            }
            
            try {
                const response = await fetch(`/api/floor-planner/shared/${state.shareToken}`);
                
                if (!response.ok) {
                    throw new Error('Projekt nicht gefunden oder Freigabe abgelaufen');
                }
                
                const data = await response.json();
                state.project = data.project;
                state.floor = data.floor;
                state.elements = data.elements || [];
                state.rooms = data.rooms || [];
                
                // Update UI
                document.getElementById('projectInfo').textContent = state.project.name;
                document.getElementById('elementCount').textContent = state.elements.length + ' Elemente';
                
                // Load floor plan image
                if (state.floor.floor_plan_data) {
                    const img = new Image();
                    img.onload = () => {
                        state.floorPlanImage = img;
                        resizeCanvas();
                        zoomFit();
                        render();
                        hideLoading();
                    };
                    img.src = state.floor.floor_plan_data;
                } else {
                    hideLoading();
                    showToast('Kein Grundriss vorhanden', 'warning');
                }
                
                // Setup event listeners
                setupEventListeners();
                
            } catch (error) {
                console.error('Load error:', error);
                showError(error.message);
            }
        }
        
        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }
        
        function showError(message) {
            document.getElementById('loadingOverlay').innerHTML = `
                <div class="error-message">
                    <i class="bi bi-exclamation-triangle"></i>
                    <h3>Fehler</h3>
                    <p>${message}</p>
                    <a href="/" class="btn btn-primary mt-3">Zur Startseite</a>
                </div>
            `;
        }
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        
        function setupEventListeners() {
            window.addEventListener('resize', () => {
                resizeCanvas();
                render();
            });
            
            // Element buttons
            document.querySelectorAll('.element-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.element-btn').forEach(b => b.style.background = '');
                    btn.style.background = '#e91e63';
                    btn.style.color = 'white';
                    state.selectedType = btn.dataset.type;
                    showToast(`${ELEMENT_CONFIG[state.selectedType]?.name || state.selectedType} ausgewählt - Klicken Sie auf den Plan`, 'info');
                });
            });
            
            // Canvas click to add element
            canvas.addEventListener('click', (e) => {
                if (state.selectedType) {
                    const rect = canvas.getBoundingClientRect();
                    const x = (e.clientX - rect.left - state.panX) / state.zoom;
                    const y = (e.clientY - rect.top - state.panY) / state.zoom;
                    
                    addElement(state.selectedType, x, y);
                    
                    // Deselect
                    document.querySelectorAll('.element-btn').forEach(b => {
                        b.style.background = '';
                        b.style.color = '';
                    });
                    state.selectedType = null;
                }
            });
            
            // Pan with middle mouse or drag
            canvas.addEventListener('mousedown', (e) => {
                if (e.button === 1 || (e.button === 0 && !state.selectedType)) {
                    state.isDragging = true;
                    state.dragStart = { x: e.clientX - state.panX, y: e.clientY - state.panY };
                }
            });
            
            canvas.addEventListener('mousemove', (e) => {
                if (state.isDragging) {
                    state.panX = e.clientX - state.dragStart.x;
                    state.panY = e.clientY - state.dragStart.y;
                    render();
                }
            });
            
            canvas.addEventListener('mouseup', () => state.isDragging = false);
            canvas.addEventListener('mouseleave', () => state.isDragging = false);
            
            // Zoom with wheel
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                state.zoom = Math.max(0.1, Math.min(5, state.zoom * delta));
                render();
            });
        }
        
        function addElement(type, x, y) {
            const config = ELEMENT_CONFIG[type] || {};
            const id = Date.now();
            const code = type.substring(0, 2).toUpperCase() + String(state.elements.length + 1).padStart(2, '0');
            
            state.elements.push({
                id,
                element_type: type,
                code,
                x,
                y,
                rotation: 0,
                isNew: true // Mark as customer-added
            });
            
            document.getElementById('elementCount').textContent = state.elements.length + ' Elemente';
            showToast(`${config.name || type} hinzugefügt!`, 'success');
            render();
        }
        
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(state.panX, state.panY);
            ctx.scale(state.zoom, state.zoom);
            
            // Draw floor plan
            if (state.floorPlanImage) {
                ctx.drawImage(state.floorPlanImage, 0, 0);
            }
            
            // Draw rooms
            state.rooms.forEach(room => {
                ctx.fillStyle = room.color + '40';
                ctx.strokeStyle = room.color;
                ctx.lineWidth = 2;
                ctx.fillRect(room.x, room.y, room.width, room.height);
                ctx.strokeRect(room.x, room.y, room.width, room.height);
                
                ctx.fillStyle = 'white';
                ctx.font = '14px Arial';
                ctx.fillText(room.name, room.x + 5, room.y + 20);
            });
            
            // Draw elements
            state.elements.forEach(el => {
                drawElement(el);
            });
            
            ctx.restore();
        }
        
        function drawElement(el) {
            const x = el.x;
            const y = el.y;
            const size = SYMBOL_SIZE;
            
            // White box
            ctx.fillStyle = 'white';
            ctx.strokeStyle = el.isNew ? '#28a745' : '#000';
            ctx.lineWidth = el.isNew ? 3 : 2;
            ctx.fillRect(x - size/2, y - size/2, size, size);
            ctx.strokeRect(x - size/2, y - size/2, size, size);
            
            // Symbol based on type
            ctx.fillStyle = '#000';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const symbols = {
                'steckdose_schuko': '⏺',
                'steckdose_doppelt': '⏺⏺',
                'schalter_aus': '○',
                'schalter_wechsel': '◐',
                'licht_decke': '✕',
                'licht_wand': '⌐'
            };
            
            ctx.fillText(symbols[el.element_type] || '•', x, y);
            
            // Code badge
            if (el.code) {
                ctx.fillStyle = el.isNew ? '#28a745' : '#e91e63';
                ctx.fillRect(x + size/2 - 5, y - size/2 - 10, 25, 14);
                ctx.fillStyle = 'white';
                ctx.font = '9px Arial';
                ctx.fillText(el.code, x + size/2 + 7, y - size/2 - 3);
            }
        }
        
        function zoomIn() {
            state.zoom = Math.min(5, state.zoom * 1.2);
            render();
        }
        
        function zoomOut() {
            state.zoom = Math.max(0.1, state.zoom / 1.2);
            render();
        }
        
        function zoomFit() {
            if (!state.floorPlanImage) return;
            
            const padding = 50;
            const scaleX = (canvas.width - padding * 2) / state.floorPlanImage.width;
            const scaleY = (canvas.height - padding * 2) / state.floorPlanImage.height;
            state.zoom = Math.min(scaleX, scaleY);
            
            state.panX = (canvas.width - state.floorPlanImage.width * state.zoom) / 2;
            state.panY = (canvas.height - state.floorPlanImage.height * state.zoom) / 2;
            
            render();
        }
        
        async function submitChanges() {
            const newElements = state.elements.filter(el => el.isNew);
            
            if (newElements.length === 0) {
                showToast('Keine neuen Elemente hinzugefügt', 'info');
                return;
            }
            
            showToast('Änderungen werden gespeichert...', 'info');
            
            // TODO: Save via API
            // For now just show success
            setTimeout(() => {
                showToast(`${newElements.length} neue Elemente gespeichert! Tali Service wurde benachrichtigt.`, 'success');
                
                // Mark elements as saved
                state.elements.forEach(el => el.isNew = false);
                render();
            }, 1000);
        }
        
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `alert alert-${type === 'success' ? 'success' : type === 'warning' ? 'warning' : 'info'} mb-2`;
            toast.style.cssText = 'min-width: 300px;';
            toast.innerHTML = message;
            container.appendChild(toast);
            
            setTimeout(() => toast.remove(), 3000);
        }
        
        // Start
        init();
    </script>
</body>
</html>
