        async function loadDocs() {
            const list = document.getElementById('docList');
            list.innerHTML = '<div class="empty-docs">Lade...</div>';
            
            try {
                // Lade beide: Angebote und Rechnungen
                const [quotRes, invRes] = await Promise.all([
                    fetch(`${API}/customers/${state.customerId}/quotations`),
                    fetch(`${API}/customers/${state.customerId}/invoices`)
                ]);
                
                state.quotations = await quotRes.json();
                state.invoices = await invRes.json();
                
                renderDocs();
            } catch (e) {
                list.innerHTML = '<div class="empty-docs">Fehler beim Laden</div>';
            }
        }

        function renderDocs() {
            const list = document.getElementById('docList');
            const docs = state.docType === 'quotations' ? state.quotations : state.invoices;
            
            if (docs.length === 0) {
                list.innerHTML = `<div class="empty-docs">Keine ${state.docType === 'quotations' ? 'Angebote' : 'Rechnungen'}</div>`;
                return;
            }
            
            list.innerHTML = '';
            
            docs.forEach(d => {
                const div = document.createElement('div');
                div.className = 'doc-item';
                div.dataset.id = d.id;
                
                const date = new Date(d.voucherDate).toLocaleDateString('de-DE');
                const amount = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(d.totalAmount);
                const statusMap = { accepted: 'Angenommen', open: 'Offen', draft: 'Entwurf', paid: 'Bezahlt', paidoff: 'Bezahlt', overdue: 'Überfällig' };
                const statusClass = ['paid', 'paidoff', 'accepted'].includes(d.voucherStatus) ? 'paid' : (d.voucherStatus === 'open' ? 'open' : '');
                
                // Rechnungstyp-Badge (Abschlag/Normal)
                let typeBadge = '';
                if (state.docType === 'invoices' && d.invoiceType === 'downpayment') {
                    typeBadge = '<span class="doc-type-badge downpayment">Abschlag</span>';
                }
                
                // Angebots-Referenz bei Rechnungen
                let relationInfo = '';
                if (state.docType === 'invoices' && d.relatedQuotationId) {
                    const relQuot = state.quotations.find(q => q.id === d.relatedQuotationId);
                    if (relQuot) {
                        relationInfo = `<div class="doc-relation">↳ zu ${relQuot.voucherNumber || 'Angebot'}</div>`;
                    }
                }
                
                div.innerHTML = `
                    <div class="doc-header">
                        <span class="doc-number">${d.voucherNumber || (state.docType === 'quotations' ? 'Angebot' : 'Rechnung')}${typeBadge}</span>
                        <span class="doc-status ${statusClass}">${statusMap[d.voucherStatus] || d.voucherStatus}</span>
                    </div>
                    <div class="doc-meta">
                        <span>${date}</span>
                        <span class="doc-amount">${amount}</span>
                    </div>
                    ${relationInfo}
                `;
                
                div.onclick = () => selectDoc(d);
                list.appendChild(div);
            });
            
            // Wenn Angebot ausgewählt, zeige zugehörige Rechnungen
            if (state.docType === 'quotations' && state.selectedDoc) {
                showRelatedInvoices(state.selectedDoc.id);
            }
        }

        function selectDoc(doc) {
            // Toggle
            if (state.selectedDoc?.id === doc.id) {
                clearContext();
                return;
            }
            
            state.selectedDoc = doc;
            
            document.querySelectorAll('.doc-item').forEach(el => {
                el.classList.remove('selected');
                el.classList.remove('related');
            });
            document.querySelector(`.doc-item[data-id="${doc.id}"]`)?.classList.add('selected');
            
            const type = state.docType === 'quotations' ? '📋' : '🧾';
            const amount = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(doc.totalAmount);
            document.getElementById('contextText').textContent = `${doc.voucherNumber} • ${amount}`;
            document.getElementById('contextBadge').classList.add('active');
            
            // Bei Angebot-Auswahl: Zeige zugehörige Rechnungen
            if (state.docType === 'quotations') {
                showRelatedInvoices(doc.id);
            }
        }

        function showRelatedInvoices(quotationId) {
            // Entferne alte related-section
            document.querySelectorAll('.related-section').forEach(el => el.remove());
            
            // Finde zugehörige Rechnungen
            const relatedInvoices = state.invoices.filter(inv => inv.relatedQuotationId === quotationId);
            
            if (relatedInvoices.length === 0) return;
            
            // Berechne Summen
            const totalInvoiced = relatedInvoices.reduce((sum, inv) => sum + (inv.totalAmount || 0), 0);
            const quotation = state.quotations.find(q => q.id === quotationId);
            const quotationTotal = quotation?.totalAmount || 0;
            const remaining = quotationTotal - totalInvoiced;
            
            // Erstelle Related-Section
            const section = document.createElement('div');
            section.className = 'related-section active';
            
            let invoicesHtml = '';
            relatedInvoices.forEach(inv => {
                const date = new Date(inv.voucherDate).toLocaleDateString('de-DE');
                const amount = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(inv.totalAmount);
                const isDownpayment = inv.invoiceType === 'downpayment';
                const statusMap = { paid: '✅', paidoff: '✅', open: '⏳', draft: '📝', overdue: '⚠️' };
                
                invoicesHtml += `
                    <div class="doc-item related" data-id="${inv.id}" onclick="selectRelatedInvoice('${inv.id}')" style="margin-left: 0;">
                        <div class="doc-header">
                            <span class="doc-number">${inv.voucherNumber || 'Rechnung'}
                                <span class="doc-type-badge ${isDownpayment ? 'downpayment' : ''}">${isDownpayment ? 'Abschlag' : 'Gesamt'}</span>
                            </span>
                            <span>${statusMap[inv.voucherStatus] || ''}</span>
                        </div>
                        <div class="doc-meta">
                            <span>${date}</span>
                            <span class="doc-amount">${amount}</span>
                        </div>
                    </div>
                `;
            });
            
            const remainingFormatted = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(remaining);
            const totalFormatted = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(totalInvoiced);
            const summaryColor = remaining <= 0 ? 'var(--success)' : 'var(--warning)';
            
            section.innerHTML = `
                <h4>🧾 Zugehörige Rechnungen (${relatedInvoices.length})</h4>
                <div class="related-summary">
                    Berechnet: ${totalFormatted} | 
                    <span style="color: ${summaryColor}">Rest: ${remainingFormatted}</span>
                </div>
                ${invoicesHtml}
            `;
            
            // Füge nach dem ausgewählten Angebot ein
            const selectedEl = document.querySelector(`.doc-item[data-id="${quotationId}"]`);
            if (selectedEl) {
                selectedEl.after(section);
            }
        }

        function selectRelatedInvoice(invoiceId) {
            const invoice = state.invoices.find(inv => inv.id === invoiceId);
            if (!invoice) return;
            
            // Wechsle zu Rechnungen-Tab mit dieser Rechnung ausgewählt
            state.selectedDoc = invoice;
            state.docType = 'invoices';
            
            document.querySelectorAll('.doc-tab').forEach(t => t.classList.remove('active'));
            document.querySelector('.doc-tab[data-type="invoices"]').classList.add('active');
            
            renderDocs();
            
            // Scrolle zur Rechnung
            setTimeout(() => {
                const el = document.querySelector(`.doc-item[data-id="${invoiceId}"]`);
                if (el) {
                    el.classList.add('selected');
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 100);
            
            // Update Context Badge
            const amount = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(invoice.totalAmount);
            document.getElementById('contextText').textContent = `${invoice.voucherNumber} • ${amount}`;
            document.getElementById('contextBadge').classList.add('active');
        }

            const data = {
                name: name,
                email: document.getElementById('newEmail').value.trim() || null,
                phone: document.getElementById('newPhone').value.trim() || null,
                address: document.getElementById('newAddress').value.trim() || null,
                zip_code: document.getElementById('newZip').value.trim() || null,

            };
            
            try {

                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                showToast('Fehler beim Anlegen', 'error');

        // Try to match extracted text to existing customers
        async function matchCustomerFromText(extractedText, extractedData = {}) {
            try {
                const res = await fetch(`${API}/general/match-customer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: extractedText,
                        extracted_company: extractedData.company || ''
                    })
                });
                
                if (!res.ok) return [];
                const data = await res.json();
                return data.matches || [];
            } catch (e) {
                console.error('Customer matching failed:', e);
                return [];
            }
        }
        
        // Show customer match suggestions after PDF upload
        async function showCustomerMatchSuggestion(extractedText, extractedData = {}) {
            const matches = await matchCustomerFromText(extractedText, extractedData);
            
            if (matches.length === 0) return;
            
            const container = document.getElementById('customerMatchSuggestion');
            const list = document.getElementById('customerMatchList');
            
            list.innerHTML = '';
            matches.forEach(match => {
                const scoreClass = match.score >= 0.7 ? '' : (match.score >= 0.4 ? 'medium' : 'low');
                const scorePercent = Math.round(match.score * 100);
                const matchedOn = match.matched_on.join(', ');
                
                list.innerHTML += `
                    <div class="match-item" onclick="selectMatchedCustomer(${match.customer_id})">
                        <div class="match-info">
                            <div class="match-name">${match.name}</div>
                            <div class="match-details">${match.email || 'Keine E-Mail'} • Erkannt: ${matchedOn}</div>
                        </div>
                        <span class="match-score ${scoreClass}">${scorePercent}%</span>
                    </div>
                `;
            });
            
            container.classList.add('active');
        }

            button.disabled = true;
            button.innerHTML = `<span>📋</span> Angebot mit ausgewählten Positionen erstellen`;
            button.addEventListener('click', createQuoteFromSelection);
            container.appendChild(button);
            
            return container;
        }
        
        // Erstelle einzelnes Produkt-Item
        function createProductItem(product, index) {
            const item = document.createElement('div');
            item.className = 'product-item';
            item.dataset.index = index;
            
            const price = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(product.price || 0);
            
            item.innerHTML = `
                <input type="checkbox" class="product-checkbox" data-product-id="${product.id}" />
                <div class="product-info">
                    <div class="product-name">${product.title || product.name}</div>
                    <div class="product-description">${(product.description || '').substring(0, 100)}${product.description?.length > 100 ? '...' : ''}</div>
                    <div class="product-meta">
                        <span>Einheit: ${product.unit || 'Stück'}</span>
                    </div>
                </div>
                <div class="product-price">${price}</div>
            `;
            
            item.addEventListener('click', (e) => {
                if (e.target.type !== 'checkbox') {
                    const checkbox = item.querySelector('.product-checkbox');
                    checkbox.checked = !checkbox.checked;
                    checkbox.dispatchEvent(new Event('change'));
                }
            });
            
            const checkbox = item.querySelector('.product-checkbox');
            checkbox.addEventListener('change', (e) => {
                if (e.target.checked) {
                    item.classList.add('selected');
                    selectedProducts.push(product);
                } else {
                    item.classList.remove('selected');
                    selectedProducts = selectedProducts.filter(p => p.id !== product.id);
                }
                updateSelectedCount();
            });
            
            return item;
        }
        
        function updateSelectedCount() {
            const countEl = document.getElementById('selectedCount');
            const btn = document.querySelector('.create-quote-btn');
            
            if (selectedProducts.length > 0) {
                countEl.textContent = `${selectedProducts.length} ausgewählt`;
                countEl.style.display = 'inline-block';
                if (btn) btn.disabled = false;
            } else {
                countEl.style.display = 'none';
                if (btn) btn.disabled = true;
            }
        }
        
        async function createQuoteFromSelection() {
            if (!state.customerId) {
                showToast('Bitte wählen Sie zuerst einen Kunden aus', 'error');
                return;
            }
            
            if (selectedProducts.length === 0) {
                showToast('Bitte wählen Sie mindestens ein Produkt aus', 'error');
                return;
            }
            
            const btn = document.querySelector('.create-quote-btn');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `<span>⏳</span> Erstelle Angebot...`;
            }
            
            try {
                // Erstelle items Array im richtigen Format
                const items = selectedProducts.map(p => ({
                    product_id: p.id,
                    name: p.title || p.name,
                    description: p.description || '',
                    quantity: 1,
                    unit_price: p.price || 0,
                    unit: p.unit || 'Stück',
                    type: p.type || 'SERVICE'
                }));
                
                // Direkt API-Call zum Angebot erstellen
                const response = await fetch(`${API}/chat/create-quotation`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customer_id: state.customerId,
                        items: items
                    })
                });
                
                if (!response.ok) throw new Error('Failed to create quotation');
                
                const result = await response.json();
                
                // Zeige Erfolg
                addMessage('assistant', `✅ ${result.message || 'Angebot erfolgreich erstellt!'}`);
                showToast('Angebot erstellt!', 'success');
                
                // Lade Dokumente neu
                if (state.customerId) {
                    await loadDocs();
                }
                
                // Reset selection
                selectedProducts = [];
                document.querySelectorAll('.product-checkbox').forEach(cb => cb.checked = false);
                document.querySelectorAll('.product-item').forEach(item => item.classList.remove('selected'));
                updateSelectedCount();
                
            } catch (error) {
                console.error('Error creating quote:', error);
                addMessage('assistant', '❌ Fehler beim Erstellen des Angebots. Bitte versuchen Sie es erneut.');
                showToast('Fehler beim Erstellen', 'error');
            } finally {
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = `<span>📋</span> Angebot mit ausgewählten Positionen erstellen`;
                }
            }
        }
        
        // Erweitere addMessage um Produktlisten-Erkennung
        const originalAddMessage = addMessage;
        addMessage = function(role, content) {
            const msgEl = originalAddMessage(role, content);
            
            // Prüfe ob content JSON mit Produktliste ist (z.B. nach "preise" Anfrage)
            // Dies ist ein Hook - die AI müsste speziell formatieren, oder wir erkennen Keywords
            
            return msgEl;
        };
        
        // Lade Produkte interaktiv mit Checkboxen
        async function loadProductsInteractive() {
            if (!state.customerId) {
                showToast('Bitte wählen Sie zuerst einen Kunden aus', 'error');
                return;
            }
            
            addMessage('assistant', '⏳ Lade Produktkatalog...');
            
            try {
                const response = await fetch(`${API}/chat/products`);
                if (!response.ok) throw new Error('Failed to load products');
                
                const products = await response.json();
                
                // Entferne Loading-Nachricht
                const messages = document.getElementById('messages');
                const lastMsg = messages.lastElementChild;
                if (lastMsg && lastMsg.textContent.includes('Lade Produktkatalog')) {
                    lastMsg.remove();
                }
                
                // Zeige Produktauswahl
                const selectionContainer = renderProductSelection(products);
                const msgContainer = document.createElement('div');
                msgContainer.className = 'message assistant';
                msgContainer.appendChild(selectionContainer);
                messages.appendChild(msgContainer);
                messages.scrollTop = messages.scrollHeight;
                
                showToast(`${products.length} Produkte geladen`, 'success');
                
            } catch (error) {
                console.error('Error loading products:', error);
                addMessage('assistant', '❌ Fehler beim Laden der Produkte. Bitte versuchen Sie es erneut.');
                showToast('Fehler beim Laden', 'error');
            }
        }
    </script>
</body>
</html>
