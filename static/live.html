<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tali Service - Dashboard</title>
    <meta name="theme-color" content="#111827">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TaliAgent">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { 
            --bg: #0f172a; 
            --card: #1e293b; 
            --border: #334155; 
            --accent: #3b82f6; 
            --accent-hover: #2563eb; 
            --success: #22c55e; 
            --warning: #f59e0b; 
            --danger: #ef4444;
            --text: #f8fafc; 
            --muted: #94a3b8;
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
        }

        @media (display-mode: standalone) {
            body { height: 100vh; }
        }
        
        /* Header mit Quick Actions */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0.5rem 1rem; 
            background: var(--card); 
            border-bottom: 1px solid var(--border);
        }
        .header h1 { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
        .header h1 span { font-size: 1.2rem; }
        
        /* Quick Actions */
        .quick-actions { display: flex; gap: 0.5rem; align-items: center; }
        .quick-btn {
            padding: 0.4rem 0.75rem;
            background: var(--border);
            border: none;
            border-radius: 6px;
            color: var(--text);
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: all 0.15s;
        }
        .quick-btn:hover { background: var(--accent); }
        .quick-btn.active { background: var(--success); }
        .quick-btn.syncing { background: var(--warning); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%; 
            background: var(--success);
        }
        .status-dot.offline { background: var(--danger); }
        
        /* Main Layout */
        .main { display: flex; flex: 1; min-height: 0; }
        
        /* Sidebar - Kunden & Dokumente */
        .sidebar {
            width: 260px;
            background: var(--card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .sidebar-section { padding: 0.5rem; border-bottom: 1px solid var(--border); }
        .sidebar-section h3 {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.4rem;
            padding: 0 0.5rem;
        }
        
        select {
            width: 100%;
            padding: 0.5rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.85rem;
            cursor: pointer;
        }
        select:focus { border-color: var(--accent); outline: none; }
        
        /* Dokument-Liste */
        .doc-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }
        .doc-tab-bar {
            display: flex;
            gap: 0.25rem;
            padding: 0 0.5rem;
            margin-bottom: 0.5rem;
        }
        .doc-tab {
            flex: 1;
            padding: 0.4rem;
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s;
        }
        .doc-tab:hover { background: var(--border); color: var(--text); }
        .doc-tab.active { background: var(--accent); color: white; }
        
        .doc-item {
            padding: 0.5rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 0.4rem;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.15s;
        }
        .doc-item:hover { border-color: var(--accent); }
        .doc-item.selected { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }
        .doc-item.related { border-color: var(--accent); background: rgba(59, 130, 246, 0.1); }
        .doc-item.related::before {
            content: '↳';
            position: absolute;
            left: -0.8rem;
            color: var(--accent);
            font-weight: bold;
        }
        .doc-item { position: relative; }
        .doc-item .doc-header { display: flex; justify-content: space-between; margin-bottom: 0.2rem; }
        .doc-item .doc-number { font-weight: 600; }
        .doc-item .doc-type-badge {
            font-size: 0.6rem;
            padding: 0.1rem 0.3rem;
            border-radius: 4px;
            background: var(--accent);
            color: white;
            margin-left: 0.3rem;
        }
        .doc-item .doc-type-badge.downpayment { background: var(--warning); }
        .doc-item .doc-status {
            font-size: 0.65rem;
            padding: 0.15rem 0.4rem;
            border-radius: 8px;
            background: var(--border);
        }
        .doc-item .doc-status.paid { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        .doc-item .doc-status.open { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .doc-item .doc-status.accepted { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        .doc-item .doc-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.75rem; }
        .doc-item .doc-amount { color: var(--success); }
        .doc-item .doc-relation {
            font-size: 0.65rem;
            color: var(--accent);
            margin-top: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }
        
        /* Zugehörige Rechnungen Section */
        .related-section {
            background: rgba(59, 130, 246, 0.05);
            border: 1px dashed var(--accent);
            border-radius: 6px;
            padding: 0.5rem;
            margin-top: 0.5rem;
            display: none;
        }
        .related-section.active { display: block; }
        .related-section h4 {
            font-size: 0.7rem;
            color: var(--accent);
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .related-section .related-summary {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 0.3rem;
        }
        
        .empty-docs { color: var(--muted); font-size: 0.8rem; text-align: center; padding: 1rem; }
        
        /* Chat-Bereich */
        .chat-area { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            min-width: 0; 
            height: 100%; 
            overflow: hidden; /* Wichtig: verhindert Überlauf */
        }
        
        /* Chat Header mit Session */
        .chat-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }
        .chat-header select { flex: 1; max-width: 200px; }
        .chat-header .btn-sm {
            padding: 0.4rem 0.6rem;
            background: var(--accent);
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .chat-header .btn-sm:hover { background: var(--accent-hover); }
        .chat-header .btn-sm.danger { background: var(--danger); }
        .chat-header .btn-sm.danger:hover { background: #dc2626; }
        
        /* Context Badge */
        .context-badge {
            display: none;
            align-items: center;
            gap: 0.3rem;
            padding: 0.3rem 0.6rem;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid var(--success);
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--success);
        }
        .context-badge.active { display: flex; }
        .context-badge button {
            background: none;
            border: none;
            color: var(--success);
            cursor: pointer;
            padding: 0;
            font-size: 1rem;
            line-height: 1;
        }
        
        /* Messages */
        .messages {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            scroll-behavior: smooth;
            min-height: 0; /* Wichtig für Flexbox overflow */
        }
        .message {
            max-width: 85%;
            padding: 0.6rem 0.8rem;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }
        .message.user {
            background: var(--accent);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            background: var(--card);
            border: 1px solid var(--border);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message a { color: #93c5fd; }
        
        /* Nachricht-Aktionen */
        .message-actions {
            position: absolute;
            top: -8px;
            right: 4px;
            display: none;
            gap: 2px;
            padding: 2px;
            background: var(--card);
            border-radius: 6px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .message.confirm-delete {
            box-shadow: 0 0 0 2px var(--danger);
        }
        .msg-action-btn.confirm {
            background: var(--danger);
            color: white;
        }

        .btn-sm.confirm {
            background: var(--danger) !important;
            color: white !important;
        }

        .inline-confirm {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            background: var(--card);
            border-radius: 10px;
            margin-left: auto;
        }
        .inline-confirm.active { display: flex; }
        .inline-confirm .text {
            font-size: 0.85rem;
            color: var(--text);
            white-space: nowrap;
        }
        .inline-confirm .btn {
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            padding: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .inline-confirm .btn.primary {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }
        .message:hover .message-actions { display: flex; }
        .message.assistant .message-actions { right: auto; left: 4px; }
        .msg-action-btn {
            width: 24px;
            height: 24px;
            padding: 0;
            border: none;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .msg-action-btn:hover { background: var(--border); color: var(--text); }
        .msg-action-btn.delete:hover { background: var(--danger); color: white; }
        .msg-action-btn.edit:hover { background: var(--warning); color: white; }
        .msg-action-btn.copy:hover { background: var(--success); color: white; }
        .msg-action-btn.resend:hover { background: var(--accent); color: white; }
        
        /* Bearbeitungsmodus */
        .message.editing {
            background: rgba(245, 158, 11, 0.1);
            border: 2px solid var(--warning);
        }
        .message .edit-textarea {
            width: 100%;
            min-height: 60px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 0.5rem;
            font-size: 0.9rem;
            resize: vertical;
            margin-bottom: 0.5rem;
        }
        .message .edit-buttons {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }
        .message .edit-buttons button {
            padding: 0.3rem 0.6rem;
            border: none;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .message .edit-buttons .save-btn { background: var(--success); color: white; }
        .message .edit-buttons .cancel-btn { background: var(--border); color: var(--text); }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--muted);
            gap: 0.5rem;
        }
        .empty-state .icon { font-size: 2rem; opacity: 0.5; }
        
        /* Typing */
        .typing {
            display: none;
            align-items: center;
            gap: 0.3rem;
            padding: 0.4rem 0.6rem;
            background: var(--card);
            border-radius: 8px;
            width: fit-content;
            font-size: 0.8rem;
            color: var(--muted);
            margin: 0 1rem;
        }
        .typing.active { display: flex; }
        .typing-dot {
            width: 5px; height: 5px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
        /* Input */
        .input-area {
            flex: 0 0 auto; /* Nicht wachsen, nicht schrumpfen */
            padding: 0.75rem 1rem;
            padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px)); /* iOS Safe Area */
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.5rem;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.2);
        }
        textarea {
            flex: 1;
            padding: 0.6rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.9rem;
            resize: none;
            font-family: inherit;
        }
        textarea:focus { border-color: var(--accent); outline: none; }
        textarea::placeholder { color: var(--muted); }
        .send-btn {
            padding: 0.6rem 1rem;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 500;
            cursor: pointer;
        }
        .send-btn:hover { background: var(--accent-hover); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        /* Schnellaktionen */
        .quick-actions-bar {
            flex: 0 0 auto; /* Nicht wachsen, nicht schrumpfen */
            display: none;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--card);
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
            justify-content: center;
        }
        .quick-actions-bar.active { display: flex; }
        .quick-action {
            width: 44px;
            height: 44px;
            padding: 0;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            position: relative;
        }
        .quick-action:hover {
            background: var(--accent);
            border-color: var(--accent);
            transform: scale(1.1);
        }
        .quick-action::after {
            content: attr(title);
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            color: var(--text);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            border: 1px solid var(--border);
            z-index: 10;
        }
        .quick-action:hover::after { opacity: 1; }
        .quick-action.highlight {
            background: rgba(59, 130, 246, 0.15);
            border-color: var(--accent);
        }
        
        /* Upload Button & Area */
        .upload-btn {
            width: 36px;
            height: 36px;
            padding: 0;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .upload-btn:hover { background: var(--accent); border-color: var(--accent); }
        .upload-btn.has-file { 
            background: rgba(245, 158, 11, 0.2); 
            border-color: var(--warning); 
            color: var(--warning);
            animation: pulse-gold 1.5s infinite;
        }
        @keyframes pulse-gold {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
        }
        .upload-preview {
            display: none;
            padding: 0.5rem 0.8rem;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.1));
            border: 2px solid var(--warning);
            border-radius: 8px;
            font-size: 0.85rem;
            align-items: center;
            gap: 0.5rem;
            margin-right: auto;
            color: #fbbf24;
            font-weight: 500;
            animation: slideIn 0.3s ease;
        }
        .upload-preview.active { display: flex; }
        .upload-preview .file-icon { font-size: 1.2rem; }
        .upload-preview .filename { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .upload-preview .file-size { font-size: 0.7rem; color: var(--muted); }
        .upload-preview .remove-file { 
            background: rgba(239, 68, 68, 0.2); 
            border: 1px solid var(--danger); 
            color: var(--danger); 
            cursor: pointer; 
            font-size: 0.9rem; 
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            margin-left: 0.3rem;
            transition: all 0.15s;
        }
        .upload-preview .remove-file:hover { background: var(--danger); color: white; }
        
        /* Datei-Nachricht im Chat */
        .message.file-message {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(245, 158, 11, 0.05));
            border: 1px solid var(--warning);
        }
        .message .file-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.6rem;
            background: rgba(245, 158, 11, 0.2);
            border-radius: 6px;
            font-size: 0.8rem;
            color: #fbbf24;
            margin-bottom: 0.4rem;
        }
        
        /* Modal für neuen Kunden */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card);
            border-radius: 12px;
            padding: 1.5rem;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border);
        }
        .modal-content h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .modal-content .form-group { margin-bottom: 0.75rem; }
        .modal-content label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 0.3rem;
        }
        .modal-content input {
            width: 100%;
            padding: 0.5rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.9rem;
        }
        .modal-content input:focus { border-color: var(--accent); outline: none; }
        .modal-buttons { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .modal-buttons button {
            flex: 1;
            padding: 0.6rem;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .modal-buttons .btn-cancel { background: var(--border); color: var(--text); }
        .modal-buttons .btn-save { background: var(--accent); color: white; }
        
        /* Kundentyp Toggle */
        .customer-type-toggle {
            display: flex;
            gap: 0.5rem;
        }
        .type-btn {
            flex: 1;
            padding: 0.6rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text-dim);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .type-btn:hover {
            border-color: var(--accent);
        }
        .type-btn.active {
            border-color: var(--accent);
            background: rgba(74, 144, 226, 0.15);
            color: var(--text);
            font-weight: 500;
        }
        .gewerbe-fields {
            border-top: 1px solid var(--border);
            padding-top: 0.75rem;
            margin-top: 0.75rem;
        }
        .field-hint {
            display: block;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 0.25rem;
        }
        
        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            padding: 0.75rem 1rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
            z-index: 200;
            animation: slideIn 0.3s ease;
        }
        .toast.active { display: flex; }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.8); } }
        
        /* Customer Match Suggestion */
        .customer-match-suggestion {
            display: none;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(59, 130, 246, 0.05));
            border: 2px solid var(--accent);
            border-radius: 10px;
            padding: 0.75rem;
            margin: 0.5rem 1rem;
            animation: slideDown 0.3s ease;
        }
        .customer-match-suggestion.active { display: block; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .customer-match-suggestion h4 {
            font-size: 0.85rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .match-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 0.4rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .match-item:hover { border-color: var(--accent); background: rgba(59, 130, 246, 0.1); }
        .match-item .match-info { flex: 1; }
        .match-item .match-name { font-weight: 600; font-size: 0.85rem; }
        .match-item .match-details { font-size: 0.75rem; color: var(--muted); }
        .match-item .match-score {
            padding: 0.2rem 0.5rem;
            background: var(--success);
            color: white;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .match-item .match-score.medium { background: var(--warning); }
        .match-item .match-score.low { background: var(--border); color: var(--text); }
        .dismiss-match {
            display: block;
            text-align: center;
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 0.5rem;
            cursor: pointer;
        }
        .dismiss-match:hover { color: var(--danger); }
        
        /* Document History Sidebar Section */
        .doc-history-section {
            border-top: 1px solid var(--border);
            padding: 0.5rem;
            max-height: 200px;
            overflow-y: auto;
        }
        .doc-history-section h3 {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.4rem;
            padding: 0 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .uploaded-doc-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.5rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 0.3rem;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .uploaded-doc-item:hover { border-color: var(--accent); }
        .uploaded-doc-item .doc-icon { font-size: 1rem; }
        .uploaded-doc-item .doc-info { flex: 1; overflow: hidden; }
        .uploaded-doc-item .doc-name { 
            font-weight: 500; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .uploaded-doc-item .doc-time { font-size: 0.65rem; color: var(--muted); }
        .uploaded-doc-item .doc-extracted { 
            font-size: 0.6rem; 
            color: var(--success); 
            background: rgba(34, 197, 94, 0.1);
            padding: 0.1rem 0.3rem;
            border-radius: 4px;
        }
        
        /* Chat History Loading Indicator */
        .history-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem;
            color: var(--muted);
            font-size: 0.85rem;
        }
        .history-loading .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Enhanced Quick Actions */
        .quick-actions-bar .divider {
            width: 1px;
            height: 30px;
            background: var(--border);
            margin: 0 0.25rem;
        }
        
        /* Mobile Menu Button */
        .mobile-menu-btn {
            display: none;
            padding: 0.4rem 0.6rem;
            background: var(--border);
            border: none;
            border-radius: 6px;
            color: var(--text);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .mobile-menu-btn:hover { background: var(--accent); }
        
        /* Sidebar Overlay für Mobile */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 49;
        }
        .sidebar-overlay.active { display: block; }
        
        /* Close Button für Mobile Sidebar */
        .sidebar-close {
            display: none;
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            width: 32px;
            height: 32px;
            background: var(--border);
            border: none;
            border-radius: 6px;
            color: var(--text);
            font-size: 1.2rem;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        .sidebar-close:hover { background: var(--danger); }
        
        /* Responsive - Tablet */
        @media (max-width: 900px) {
            .sidebar { width: 220px; }
            .chat-area { min-width: 0; }
            .quick-btn span.text { display: none; }
            .header h1 span.title-text { display: none; }
        }
        
        /* Responsive - Mobile */
        @media (max-width: 768px) {
            .header { padding: 0.5rem; }
            .header h1 { font-size: 0.9rem; }
            
            .mobile-menu-btn { display: flex; }
            
            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                bottom: 0;
                width: 280px;
                z-index: 50;
                transition: left 0.3s ease;
            }
            .sidebar.open { left: 0; }
            .sidebar-close { display: flex; }
            
            .main { flex-direction: column; }
            .chat-area { 
                flex: 1;
                min-height: 0;
                overflow: hidden;
            }
            
            .input-area { 
                padding: 0.5rem;
                padding-bottom: calc(0.5rem + env(safe-area-inset-bottom, 0px));
            }
            .quick-actions-bar {
                padding: 0.4rem;
                overflow-x: auto;
                flex-wrap: nowrap;
            }
            textarea { font-size: 16px; } /* Verhindert iOS Zoom */
            .quick-action { 
                padding: 0.5rem 0.8rem; 
                font-size: 0.8rem;
            }
            
            .message { 
                max-width: 90%; 
                font-size: 0.9rem;
            }
            
            .modal-content { 
                width: 95%; 
                padding: 1rem;
                max-height: 90vh;
                overflow-y: auto;
            }
            
            .doc-item { padding: 0.6rem; }
            .doc-tab { padding: 0.5rem; font-size: 0.8rem; }
            
            .toast { 
                left: 1rem; 
                right: 1rem; 
                bottom: 0.5rem;
            }
        }
        
        /* Responsive - Kleine Handys */
        @media (max-width: 480px) {
            .header h1 { font-size: 0.85rem; }
            .quick-btn { padding: 0.35rem 0.5rem; font-size: 0.75rem; }
            
            .message { 
                max-width: 95%;
                padding: 0.5rem 0.7rem;
            }
            
            .quick-action { 
                padding: 0.4rem 0.6rem;
                font-size: 0.75rem;
            }
            
            .input-area { gap: 0.3rem; }
            .send-btn { 
                padding: 0.5rem 0.8rem; 
                font-size: 0.85rem;
            }
        }
        
        /* Touch-friendly für alle mobilen Geräte */
        @media (hover: none) and (pointer: coarse) {
            .quick-btn, .quick-action, .doc-item, .doc-tab, .send-btn, .type-btn {
                min-height: 44px;
            }
            select, input, textarea {
                min-height: 44px;
                font-size: 16px;
            }
        }
        
        /* Produktauswahl mit Checkboxen */
        .product-selection-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin: 0.5rem 0;
        }
        
        .product-selection-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        
        .product-selection-header h4 {
            font-size: 0.9rem;
            color: var(--muted);
        }
        
        .product-item {
            display: flex;
            gap: 0.75rem;
            padding: 0.6rem;
            margin-bottom: 0.4rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .product-item:hover {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.05);
        }
        
        .product-item.selected {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.1);
        }
        
        .product-checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        
        .product-info {
            flex: 1;
        }
        
        .product-name {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.2rem;
        }
        
        .product-description {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 0.3rem;
        }
        
        .product-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.75rem;
            color: var(--muted);
        }
        
        .product-price {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--accent);
            min-width: 80px;
            text-align: right;
        }
        
        .create-quote-btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background 0.15s;
        }
        
        .create-quote-btn:hover {
            background: var(--accent-hover);
        }
        
        .create-quote-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
        }
        
        .selected-count {
            padding: 0.2rem 0.5rem;
            background: var(--accent);
            color: white;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Header mit Quick Actions -->
    <header class="header">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
            <button class="mobile-menu-btn" onclick="toggleSidebar()" title="Menü öffnen">☰</button>
            <h1><span>⚡</span> <span class="title-text">Tali Service</span></h1>
        </div>
        <div class="quick-actions">
            <button class="quick-btn" onclick="syncCustomers()" id="syncBtn" title="Kunden synchronisieren">
                🔄 <span class="text">Sync</span>
            </button>
            <button class="quick-btn" onclick="showNewCustomerModal()" title="Neuen Kunden anlegen">
                ➕ <span class="text">Kunde</span>
            </button>
            <button class="quick-btn" onclick="window.location.reload()" title="Seite neu laden">
                🔃
            </button>
            <div class="status-dot" id="statusDot" title="Server-Status"></div>
        </div>
    </header>
    
    <main class="main">
        <!-- Sidebar Overlay für Mobile -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
        
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
            <div class="sidebar-section">
                <h3>Kunde</h3>
                <select id="customerSelect">
                    <option value="">Kunde wählen...</option>
                </select>
            </div>
            
            <div class="sidebar-section" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                <div class="doc-tab-bar">
                    <button class="doc-tab active" data-type="quotations" onclick="switchDocTab('quotations')">Angebote</button>
                    <button class="doc-tab" data-type="invoices" onclick="switchDocTab('invoices')">Rechnungen</button>
                </div>
                <div class="doc-list" id="docList">
                    <div class="empty-docs">Kunde wählen...</div>
                </div>
            </div>
            
            <!-- Document History Section -->
            <div class="doc-history-section" id="docHistorySection" style="display: none;">
                <h3>
                    📁 Hochgeladene Dokumente
                    <span id="docHistoryCount" style="font-size: 0.65rem; background: var(--accent); color: white; padding: 0.1rem 0.4rem; border-radius: 10px;">0</span>
                </h3>
                <div id="docHistoryList"></div>
            </div>
        </aside>
        
        <!-- Chat -->
        <section class="chat-area">
            <div class="chat-header">
                <select id="sessionSelect" disabled>
                    <option value="">Auftrag wählen...</option>
                </select>
                <button class="btn-sm" onclick="createNewSession()" id="newSessionBtn" disabled>+ Neu</button>
                <button class="btn-sm danger" onclick="deleteCurrentSession()" id="deleteBtn" disabled>🗑️</button>
                <button class="btn-sm" onclick="refreshChat()" id="refreshBtn" title="Chat aktualisieren">🔄</button>
                <button class="btn-sm" onclick="clearChat()" id="clearBtn" title="Chat leeren">🧹</button>
                <div class="inline-confirm" id="inlineConfirm">
                    <span class="text" id="inlineConfirmText">Wirklich?</span>
                    <button class="btn" onclick="inlineConfirmCancel()">Abbrechen</button>
                    <button class="btn primary" id="inlineConfirmOk" onclick="inlineConfirmOk()">Löschen</button>
                </div>
                <div class="context-badge" id="contextBadge">
                    <span>📄</span>
                    <span id="contextText">-</span>
                    <button onclick="clearContext()">×</button>
                </div>
            </div>
            
            <div class="messages" id="messages">
                <div class="empty-state">
                    <span class="icon">🤖</span>
                    <p><strong>Allgemeiner Chat</strong></p>
                    <p style="font-size: 0.8rem; color: var(--muted);">Frag mich alles über Elektro!</p>
                </div>
            </div>
            
            <div class="typing" id="typing">
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
                <span>AI antwortet...</span>
            </div>
            
            <!-- Customer Match Suggestion (appears after PDF upload) -->
            <div class="customer-match-suggestion" id="customerMatchSuggestion">
                <h4>🔍 Mögliche Kundenzuordnung erkannt</h4>
                <div id="customerMatchList"></div>
                <span class="dismiss-match" onclick="dismissCustomerMatch()">❌ Keine Zuordnung</span>
            </div>
            
            <div class="quick-actions-bar" id="quickActions">
                <button class="quick-action" onclick="quickAction('preise')" title="Preise">💰</button>
                <button class="quick-action" onclick="loadProductsInteractive()" title="Produkte auswählen" style="background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; font-size: 1.5rem; padding: 0.8rem; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);">📦</button>
                <button class="quick-action" onclick="quickAction('angebot')" title="Angebot">📋</button>
                <button class="quick-action" onclick="quickAction('rechnung')" title="Rechnung">🧾</button>
                <button class="quick-action" onclick="quickAction('abschlag')" title="Abschlag">📊</button>
                <div class="divider"></div>
                <button class="quick-action" onclick="quickAction('status')" title="Offene Posten">📈</button>
                <button class="quick-action" onclick="quickAction('analyse')" title="Analysieren">🔍</button>
                <button class="quick-action" onclick="quickAction('steuer')" title="Steuer-IDs">📝</button>
                <div class="divider"></div>
                <button class="quick-action" onclick="quickAction('hilfe')" title="Hilfe">❓</button>
            </div>
            
            <div class="input-area">
                <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.txt,.csv,.xlsx,.xls,.doc,.docx" style="display:none" onchange="handleFileSelect(event)">
                <button class="upload-btn" id="uploadBtn" onclick="document.getElementById('fileInput').click()" title="Datei hochladen">📎</button>
                <div class="upload-preview" id="uploadPreview">
                    <span class="file-icon" id="fileIcon">📄</span>
                    <div style="display:flex;flex-direction:column;">
                        <span class="filename" id="uploadFilename"></span>
                        <span class="file-size" id="uploadFileSize"></span>
                    </div>
                    <button class="remove-file" onclick="clearUpload()">✕</button>
                </div>
                <textarea id="messageInput" placeholder="Nachricht... (Enter = Senden)" rows="1"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
        </section>
    </main>
    
    <!-- Modal: Neuer Kunde -->
    <div class="modal" id="newCustomerModal">
        <div class="modal-content">
            <h2>➕ Neuer Kunde</h2>
            <div class="form-group">
                <label>Kundentyp *</label>
                <div class="customer-type-toggle">
                    <button type="button" id="typePrivat" class="type-btn active" onclick="setCustomerType('privat')">👤 Privat</button>
                    <button type="button" id="typeGewerbe" class="type-btn" onclick="setCustomerType('gewerbe')">🏢 Gewerbe</button>
                </div>
            </div>
            <div class="form-group">
                <label>Name *</label>
                <input type="text" id="newName" placeholder="Firma oder Name">
            </div>
            <div class="form-group">
                <label>E-Mail</label>
                <input type="email" id="newEmail" placeholder="email@beispiel.de">
            </div>
            <div class="form-group">
                <label>Telefon</label>
                <input type="tel" id="newPhone" placeholder="+49 123 456789">
            </div>
            <div class="form-group">
                <label>Adresse</label>
                <input type="text" id="newAddress" placeholder="Straße Nr.">
            </div>
            <div class="form-group">
                <label>PLZ / Ort</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="newZip" placeholder="PLZ" style="width: 80px;">
                    <input type="text" id="newCity" placeholder="Stadt" style="flex: 1;">
                </div>
            </div>
            <!-- Gewerbe-spezifische Felder (nur sichtbar bei Gewerbe) -->
            <div id="gewerbeFields" class="gewerbe-fields" style="display: none;">
                <div class="form-group">
                    <label>USt-IdNr.</label>
                    <input type="text" id="newVatId" placeholder="DE123456789">
                    <small class="field-hint">Für innergemeinschaftliche Leistungen (§ 13b UStG)</small>
                </div>
                <div class="form-group">
                    <label>Steuernummer</label>
                    <input type="text" id="newTaxNumber" placeholder="12/345/67890">
                </div>
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="hideNewCustomerModal()">Abbrechen</button>
                <button class="btn-save" onclick="createNewCustomer()">Anlegen</button>
            </div>
        </div>
    </div>
    
    <!-- Toast -->
    <div class="toast" id="toast">
        <span id="toastIcon">✅</span>
        <span id="toastText">Erfolgreich!</span>
    </div>
    
    <script>
        // Dynamische API-URL: Verwendet den aktuellen Origin (funktioniert mit HTTP und HTTPS)
        const API = window.location.origin;
        let state = {
            customerId: null,
            sessionId: null,
            customer: null,
            customers: {},
            docType: 'quotations',
            selectedDoc: null,
            quotations: [],  // Cache für Angebote
            invoices: [],    // Cache für Rechnungen
            chatHistory: [], // Multi-turn conversation history
            uploadedDocuments: [], // Track uploaded documents for current customer
            lastExtractedText: null, // Store last PDF extracted text for matching
            lastExtractedData: null  // Store last PDF extracted data (VAT, Tax, etc.)
        };

        // Mobile Sidebar Toggle
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
            document.body.style.overflow = sidebar.classList.contains('open') ? 'hidden' : '';
        }
        
        // Sidebar schließen bei Auswahl auf Mobile
        function closeSidebarOnMobile() {
            if (window.innerWidth <= 768) {
                toggleSidebar();
            }
        }

        // Init
        document.addEventListener('DOMContentLoaded', init);
        
        async function init() {
            await loadCustomers();
            setupEvents();
            // Allgemeinen Chat-Modus aktivieren (ohne Kunde)
            enableGeneralChat();
        }
        
        function enableGeneralChat() {
            state.generalMode = true;
            state.sessionId = null;
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            
            // Lade gespeicherte allgemeine Chat-Nachrichten
            loadMessages();
        }

        // Events
        function setupEvents() {
            document.getElementById('customerSelect').addEventListener('change', onCustomerChange);
            document.getElementById('sessionSelect').addEventListener('change', onSessionChange);
            document.getElementById('messageInput').addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
            });
        }

        // Kunden laden
        async function loadCustomers() {
            try {
                const res = await fetch(`${API}/customers`);
                if (!res.ok) throw new Error();
                const customers = await res.json();
                
                const select = document.getElementById('customerSelect');
                select.innerHTML = '<option value="">Kunde wählen...</option>';
                customers.forEach(c => {
                    state.customers[c.id] = c;
                    select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
                });
                
                document.getElementById('statusDot').classList.remove('offline');
            } catch (e) {
                document.getElementById('statusDot').classList.add('offline');
                showToast('Server nicht erreichbar', 'error');
            }
        }

        async function onCustomerChange(e) {
            if (!e.target.value) { resetUI(); return; }
            
            state.customerId = e.target.value;
            state.customer = state.customers[state.customerId];
            
            await Promise.all([loadSessions(), loadDocs(), loadCustomerChatHistory(), loadCustomerDocuments()]);
            
            document.getElementById('sessionSelect').disabled = false;
            document.getElementById('newSessionBtn').disabled = false;
            
            // WICHTIG: Aktiviere Kunden-Chat-Modus (ohne Session)
            // User kann jetzt allgemein über den Kunden chatten
            state.sessionId = null;
            enableCustomerChat();
            
            // Sidebar auf Mobile schließen nach Auswahl
            closeSidebarOnMobile();
        }
        
        function enableCustomerChat() {
            // Kunden-Chat: Kunde ist ausgewählt, aber keine Session
            // Man kann allgemein über den Kunden sprechen
            const customerName = state.customer ? state.customer.name : 'Kunde';
            
            // Prüfe ob bereits Chat-Historie vorhanden ist
            if (state.chatHistory.length === 0) {
                document.getElementById('messages').innerHTML = `
                    <div class="empty-state">
                        <span class="icon">👤</span>
                        <p><strong>Chat über ${customerName}</strong></p>
                        <p style="font-size: 0.8rem; color: var(--muted);">Frage mich alles über diesen Kunden!<br>Oder wähle einen Auftrag für spezifische Aufträge.</p>
                    </div>
                `;
            }
            
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('messageInput').placeholder = `Frage über ${customerName}...`;
        }

        function resetUI() {
            state.customerId = null;
            state.sessionId = null;
            state.customer = null;
            state.selectedDoc = null;
            state.chatHistory = [];
            state.uploadedDocuments = [];
            
            document.getElementById('sessionSelect').disabled = true;

        // Inline Confirm (Option A)
        let _pendingHeaderAction = null;

        function inlineConfirmOpen(action) {
            const bar = document.getElementById('inlineConfirm');
            const text = document.getElementById('inlineConfirmText');
            const ok = document.getElementById('inlineConfirmOk');
            if (!bar || !text || !ok) return;

            _pendingHeaderAction = action;
            if (action === 'delete-session') {
                text.textContent = 'Auftrag wirklich löschen?';
                ok.textContent = 'Auftrag löschen';
            } else if (action === 'clear-chat') {
                text.textContent = state.sessionId ? 'Chat wirklich leeren?' : 'Allgemeinen Chat leeren?';
                ok.textContent = 'Leeren';
            } else {
                text.textContent = 'Wirklich ausführen?';
                ok.textContent = 'OK';
            }

            bar.classList.add('active');
        }

        function inlineConfirmCancel() {
            const bar = document.getElementById('inlineConfirm');
            if (bar) bar.classList.remove('active');
            _pendingHeaderAction = null;
        }

        async function inlineConfirmOk() {
            const action = _pendingHeaderAction;
            inlineConfirmCancel();
            if (!action) return;

            if (action === 'delete-session') {
                if (!state.sessionId) return;
                try {
                    const res = await fetch(`${API}/chat/sessions/${state.sessionId}`, { method: 'DELETE' });
                    if (!res.ok) throw new Error();
                    await loadSessions();
                    showToast('Auftrag gelöscht', 'success');
                } catch (e) {
                    showToast('Fehler', 'error');
                }
                return;
            }

            if (action === 'clear-chat') {
                try {
                    if (state.sessionId) {
                        const res = await fetch(`${API}/chat/sessions/${state.sessionId}/messages`, { method: 'DELETE' });
                        if (!res.ok) throw new Error();
                    } else {
                        const res = await fetch(`${API}/general/messages`, { method: 'DELETE' });
                        if (!res.ok) throw new Error();
                    }
                    await loadMessages();
                    showToast('Chat geleert', 'success');
                } catch (e) {
                    showToast('Fehler beim Leeren', 'error');
                }
            }
        }

        // Schnellaktionen

        // Messages
        async function loadMessages() {
            try {
                const div = document.getElementById('messages');
                div.innerHTML = '';

                if (!state.sessionId) {
                    // General chat - load from general messages store
                    const res = await fetch(`${API}/general/messages`);
                    if (!res.ok) {
                        div.innerHTML = `\n                        <div class="empty-state">\n                            <span class="icon">🤖</span>\n                            <p><strong>Allgemeiner Chat</strong></p>\n                            <p style="font-size: 0.8rem; color: var(--muted);">Frag mich alles über Elektro!</p>\n                        </div>\n                    `;
                        return;
                    }
                    const messages = await res.json();
                    if (!messages || messages.length === 0) {
                        div.innerHTML = '<div class="empty-state"><span class="icon">🤖</span><p><strong>Allgemeiner Chat</strong></p><p style="font-size: 0.8rem; color: var(--muted);">Frag mich alles über Elektro!</p></div>';
                    } else {
                        messages.forEach(m => addMessage(m.role, m.content, m.id));
                    }
                    return;
                }

                const res = await fetch(`${API}/chat/sessions/${state.sessionId}/messages`);
                const messages = await res.json();

                if (messages.length === 0) {
                    div.innerHTML = '<div class="empty-state"><span class="icon">💬</span><p>Starte die Konversation</p></div>';
                } else {
                    messages.forEach(m => addMessage(m.role, m.content, m.id));
                }
            } catch (e) { console.error(e); }
        }

        function addMessage(role, content, messageId = null) {
            const div = document.getElementById('messages');
            const empty = div.querySelector('.empty-state');
            if (empty) empty.remove();
            
            const msg = document.createElement('div');
            msg.className = 'message ' + role;
            if (messageId) msg.dataset.messageId = messageId;
            
            // Aktions-Buttons
            const actionsHtml = `
                <div class="message-actions">
                    ${role === 'user' ? `<button class="msg-action-btn edit" onclick="editMessage(this)" title="Bearbeiten">✏️</button>` : ''}
                    ${role === 'user' ? `<button class="msg-action-btn resend" onclick="resendMessage(this)" title="Nochmal senden">🔄</button>` : ''}
                    <button class="msg-action-btn copy" onclick="copyMessage(this)" title="Kopieren">📋</button>
                    <button class="msg-action-btn delete" onclick="deleteMessage(this)" title="Löschen">🗑️</button>
                </div>
            `;
            
            let contentHtml = content;
            if (role === 'assistant') {
                contentHtml = content
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
                    .replace(/\n/g, '<br>');
            }
            
            msg.innerHTML = actionsHtml + `<div class="message-content">${role === 'assistant' ? contentHtml : ''}</div>`;
            if (role === 'user') {
                msg.querySelector('.message-content').textContent = content;
            }
            msg.dataset.originalContent = content;
            
            div.appendChild(msg);
            div.scrollTop = div.scrollHeight;
            
            return msg;
        }
        
        // Nachricht-Aktionen
        async function deleteMessage(btn) {
            const msg = btn.closest('.message');
            const messageId = msg.dataset.messageId;
            if (!messageId) {
                showToast('Nachricht-ID fehlt!', 'error');
                return;
            }

            // Two-step confirmation: first click arms the button, second click within 5s confirms
            if (btn.dataset.confirmPending !== '1') {
                btn.dataset.confirmPending = '1';
                btn._originalHTML = btn.innerHTML;
                btn.innerHTML = '⚠️ Nochmal klicken';
                btn.classList.add('confirm');
                // Visual cue on the message
                msg.classList.add('confirm-delete');
                // Set timeout to clear pending state
                msg._deleteTimer = setTimeout(() => {
                    btn.dataset.confirmPending = '0';
                    btn.innerHTML = btn._originalHTML || '🗑️';
                    btn.classList.remove('confirm');
                    msg.classList.remove('confirm-delete');
                    delete msg._deleteTimer;
                }, 5000);
                return;
            }

            // Confirmed: clear timer and proceed with deletion
            if (msg._deleteTimer) {
                clearTimeout(msg._deleteTimer);
                delete msg._deleteTimer;
            }
            btn.dataset.confirmPending = '0';
            btn.innerHTML = btn._originalHTML || '🗑️';
            btn.classList.remove('confirm');
            msg.classList.remove('confirm-delete');

            let url = '';
            if (state.sessionId) {
                url = `${API}/chat/messages/${messageId}`;
            } else {
                url = `${API}/general/messages/${messageId}`;
            }
            try {
                const res = await fetch(url, { method: 'DELETE' });
                if (!res.ok) throw new Error('Fehler beim Löschen');
                msg.style.animation = 'fadeOut 0.2s ease';
                setTimeout(() => msg.remove(), 200);
                showToast('Nachricht gelöscht', 'success');
            } catch (e) {
                showToast('Löschen fehlgeschlagen', 'error');
            }
        }
        
        function copyMessage(btn) {
            const msg = btn.closest('.message');
            const content = msg.dataset.originalContent || msg.querySelector('.message-content').textContent;
            navigator.clipboard.writeText(content);
            showToast('Kopiert!', 'success');
        }
        
        function editMessage(btn) {
            const msg = btn.closest('.message');
            const content = msg.dataset.originalContent || msg.querySelector('.message-content').textContent;
            
            msg.classList.add('editing');
            msg.querySelector('.message-content').innerHTML = `
                <textarea class="edit-textarea">${content}</textarea>
                <div class="edit-buttons">
                    <button class="cancel-btn" onclick="cancelEdit(this)">Abbrechen</button>
                    <button class="save-btn" onclick="saveEdit(this)">Speichern & Senden</button>
                </div>
            `;
            msg.querySelector('.edit-textarea').focus();
        }
        
        function cancelEdit(btn) {
            const msg = btn.closest('.message');
            const content = msg.dataset.originalContent;
            msg.classList.remove('editing');
            msg.querySelector('.message-content').textContent = content;
        }
        
        function saveEdit(btn) {
            const msg = btn.closest('.message');
            const newContent = msg.querySelector('.edit-textarea').value.trim();
            if (!newContent) return;
            
            msg.classList.remove('editing');
            msg.querySelector('.message-content').textContent = newContent;
            msg.dataset.originalContent = newContent;
            
            // Nachfolgende Nachrichten entfernen und neu senden
            while (msg.nextElementSibling) {
                msg.nextElementSibling.remove();
            }
            
            // Neu senden
            document.getElementById('messageInput').value = newContent;
            msg.remove();
            sendMessage();
        }
        
        function resendMessage(btn) {
            const msg = btn.closest('.message');
            const content = msg.dataset.originalContent || msg.querySelector('.message-content').textContent;
            
            // Nachfolgende Nachrichten entfernen
            while (msg.nextElementSibling) {
                msg.nextElementSibling.remove();
            }
            
            // Neu senden
            document.getElementById('messageInput').value = content;
            msg.remove();
            sendMessage();
        }

        // File Upload Handling
        let uploadedFile = null;
        
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = {
                'pdf': '📕',
                'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️',
                'txt': '📝',
                'csv': '📊', 'xlsx': '📊', 'xls': '📊',
                'doc': '📄', 'docx': '📄'
            };
            return icons[ext] || '📎';
        }
        
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
        
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            uploadedFile = file;
            
            // Goldene Anzeige aktivieren
            document.getElementById('uploadBtn').classList.add('has-file');
            document.getElementById('fileIcon').textContent = getFileIcon(file.name);
            document.getElementById('uploadFilename').textContent = file.name;
            document.getElementById('uploadFileSize').textContent = formatFileSize(file.size);
            document.getElementById('uploadPreview').classList.add('active');
            
            // Toast entfernt - überflüssige Meldung
        }
        
        function clearUpload() {
            uploadedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('uploadBtn').classList.remove('has-file');
            document.getElementById('uploadPreview').classList.remove('active');
        }
        
        function addFileMessage(filename, filesize) {
            const div = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message user file-message';
            msgDiv.innerHTML = `
                <div class="file-badge">
                    ${getFileIcon(filename)} <strong>${filename}</strong> (${formatFileSize(filesize)})
                </div>
                <span>Datei zur Analyse hochgeladen</span>
            `;
            div.appendChild(msgDiv);
            div.scrollTop = div.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            let text = input.value.trim();
            
            // Entweder Text oder Datei muss vorhanden sein

            // Kontext hinzufügen wenn Dokument ausgewählt

                text = `[${type}: ${d.voucherNumber}, ID: ${d.id}, ${d.totalAmount}€, ${d.voucherStatus}]\n\n${text}`;
            }
            
            // Anzeige der User-Nachricht

            if (uploadedFile) {
                addFileMessage(uploadedFile.name, uploadedFile.size);
                if (text) {
                    userElem = addMessage('user', input.value.trim());
                    if (!state.sessionId) {
                        try {
                            const saveRes = await fetch(`${API}/general/messages`, {
                                method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ role: 'user', content: input.value.trim() })
                            });

                                userElem.dataset.messageId = saved.id;

                                const saveRes = await fetch(`${API}/general/messages`, {
                                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ role: 'assistant', content: response.content })
                                });
                                if (saveRes.ok) {
                                    const saved = await saveRes.json();
                                    assistantElem3.dataset.messageId = saved.id;
                                }
                            } catch(e) { console.error('Save general assistant message failed', e); }
                        }
                    }
                }
                // KUNDEN-CHAT MODUS (Session ausgewählt)
                else if (uploadedFile) {
                    // Mit Datei: FormData verwenden
                    const formData = new FormData();
                    formData.append('session_id', state.sessionId);
                    formData.append('file', uploadedFile);
                    
                    const res = await fetch(`${API}/chat/upload?session_id=${state.sessionId}`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (!res.ok) throw new Error();
                    response = await res.json();
                    
                    // Zusätzliche Nachricht senden wenn Text dabei
                    if (text) {
                        const textRes = await fetch(`${API}/chat/messages`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ session_id: state.sessionId, content: text })
                        });
                        if (textRes.ok) {
                            const textResponse = await textRes.json();
                            addMessage('assistant', textResponse.content);
                        }
                    } else {
                        addMessage('assistant', response.message);
                    }
                    clearUpload();
                } else {
                    // Ohne Datei: JSON
                    const res = await fetch(`${API}/chat/messages`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: state.sessionId, content: text })
                    });
                    
                    if (!res.ok) throw new Error();
                    response = await res.json();
                    addMessage('assistant', response.content);
                }
            } catch (e) {
                console.error('Send error:', e);
                addMessage('assistant', '❌ Fehler: Server nicht erreichbar');
            }
            
            document.getElementById('typing').classList.remove('active');
            document.getElementById('sendBtn').disabled = false;
            input.focus();
        }
