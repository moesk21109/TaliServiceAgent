<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuer Kunde - Tali Service</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 32px;
            text-align: center;
        }
        .header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .header p {
            opacity: 0.9;
        }
        .content {
            padding: 40px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        label .required {
            color: #ef4444;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        input::placeholder {
            color: #9ca3af;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }
        button {
            flex: 1;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }
        .btn-secondary:hover {
            background: #e5e7eb;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .message {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: none;
        }
        .message.success {
            background: #d1fae5;
            color: #065f46;
            border: 2px solid #10b981;
        }
        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #ef4444;
        }
        .message.show {
            display: block;
        }
        .info-box {
            background: #eff6ff;
            border-left: 4px solid #3b82f6;
            padding: 16px;
            margin-bottom: 24px;
            border-radius: 4px;
        }
        .info-box p {
            color: #1e40af;
            font-size: 0.9rem;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .radio-option input[type="radio"] {
            width: auto;
            cursor: pointer;
        }
        .conditional-fields {
            display: none;
            border-left: 4px solid #667eea;
            padding-left: 20px;
            margin-top: 16px;
        }
        .conditional-fields.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>➕ Neuen Kunden anlegen</h1>
            <p>Kunde wird in Lexoffice und der Datenbank gespeichert</p>
        </div>
        
        <div class="content">
            <div class="info-box">
                <p><strong>ℹ️ Hinweis:</strong> Der Kunde wird sofort in Lexoffice angelegt und erscheint dann in der Kundenliste.</p>
            </div>

            <div id="message" class="message"></div>
            
            <form id="customerForm" onsubmit="createCustomer(event)">
                <div class="form-group">
                    <label>Kundenart <span class="required">*</span></label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="customer_type" value="privat" checked onchange="toggleBusinessFields()">
                            <span>🏠 Privatkunde</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="customer_type" value="gewerbe" onchange="toggleBusinessFields()">
                            <span>🏢 Gewerbetreibender</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Firmenname / Name <span class="required">*</span></label>
                    <input type="text" id="name" required placeholder="z.B. Müller Elektro GmbH">
                </div>
                
                <div class="form-group">
                    <label>E-Mail <span class="required">*</span></label>
                    <input type="email" id="email" required placeholder="kontakt@firma.de">
                </div>
                
                <div id="businessFields" class="conditional-fields">
                    <div class="form-group">
                        <label>Umsatzsteuer-ID (USt-IdNr.)</label>
                        <input type="text" id="vat_id" placeholder="DE123456789">
                        <small style="color: #6b7280; display: block; margin-top: 4px;">
                            📋 Benötigt für § 13b UStG (Reverse Charge)
                        </small>
                    </div>
                    
                    <div class="form-group">
                        <label>Steuernummer</label>
                        <input type="text" id="tax_number" placeholder="12/345/67890">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Telefon</label>
                    <input type="tel" id="phone" placeholder="+49 40 12345678">
                </div>
                
                <div class="form-group">
                    <label>Straße & Hausnummer</label>
                    <input type="text" id="address" placeholder="Musterstraße 123">
                </div>
                
                <div class="form-group">
                    <label>PLZ</label>
                    <input type="text" id="zip_code" placeholder="20095" maxlength="5">
                </div>
                
                <div class="form-group">
                    <label>Stadt</label>
                    <input type="text" id="city" placeholder="Hamburg">
                </div>
                
                <div class="button-group">
                    <button type="button" class="btn-secondary" onclick="window.location.href='/static/live.html'">
                        ← Abbrechen
                    </button>
                    <button type="submit" class="btn-primary" id="submitBtn">
                        ✓ Kunde anlegen
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        function toggleBusinessFields() {
            const customerType = document.querySelector('input[name="customer_type"]:checked').value;
            const businessFields = document.getElementById('businessFields');
            
            if (customerType === 'gewerbe') {
                businessFields.classList.add('show');
            } else {
                businessFields.classList.remove('show');
                // Clear business fields when switching to private
                document.getElementById('vat_id').value = '';
                document.getElementById('tax_number').value = '';
            }
        }

        async function createCustomer(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');
            
            // Sammle Daten
            const customerType = document.querySelector('input[name="customer_type"]:checked').value;
            const customerData = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim() || null,
                address: document.getElementById('address').value.trim() || null,
                zip_code: document.getElementById('zip_code').value.trim() || null,
                city: document.getElementById('city').value.trim() || null,
                customer_type: customerType
            };
            
            // Add business fields only if gewerbe
            if (customerType === 'gewerbe') {
                customerData.vat_id = document.getElementById('vat_id').value.trim() || null;
                customerData.tax_number = document.getElementById('tax_number').value.trim() || null;
            }
            
            console.log("[CREATE CUSTOMER] Sending:", customerData);
            
            // UI Feedback
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Erstelle Kunde in Lexoffice...';
            messageDiv.className = 'message';
            messageDiv.style.display = 'none';
            
            try {
                const response = await fetch(`${API_URL}/customers`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(customerData)
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || `HTTP ${response.status}`);
                }
                
                const result = await response.json();
                console.log("[CREATE CUSTOMER] Success:", result);
                
                // Erfolg anzeigen
                messageDiv.className = 'message success show';
                messageDiv.innerHTML = `
                    <strong>✅ Kunde erfolgreich angelegt!</strong><br>
                    ${result.name} wurde in Lexoffice und der Datenbank gespeichert.
                `;
                
                // Formular leeren
                document.getElementById('customerForm').reset();
                
                // Nach 2 Sekunden zur Kundenliste
                setTimeout(() => {
                    window.location.href = '/static/live.html';
                }, 2000);
                
            } catch (error) {
                console.error("[CREATE CUSTOMER] Error:", error);
                
                messageDiv.className = 'message error show';
                messageDiv.innerHTML = `
                    <strong>❌ Fehler beim Anlegen</strong><br>
                    ${error.message}
                `;
                
                submitBtn.disabled = false;
                submitBtn.textContent = '✓ Kunde anlegen';
            }
        }
        
        // Auto-Format PLZ (nur Zahlen)
        document.getElementById('zip_code').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
