<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Usage Statistics - Tali Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-value {
            color: #333;
            font-size: 2.5rem;
            font-weight: bold;
        }

        .stat-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .recent-requests {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-height: 500px;
            overflow-y: auto;
        }

        .recent-requests h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .request-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .request-item:last-child {
            border-bottom: none;
        }

        .request-info {
            flex: 1;
        }

        .request-endpoint {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .request-meta {
            font-size: 0.85rem;
            color: #666;
        }

        .request-tokens {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .request-failed {
            background: #e74c3c;
        }

        .request-success {
            background: #2ecc71;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2rem;
        }

        .error {
            background: #e74c3c;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .refresh-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: block;
            margin: 30px auto;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.3);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .last-updated {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 API Usage Statistics</h1>
        
        <div id="content">
            <div class="loading">Laden...</div>
        </div>
        
        <button class="refresh-btn" onclick="loadStats()">🔄 Aktualisieren</button>
        
        <div class="last-updated" id="lastUpdated"></div>
    </div>

    <script>
        async function loadStats() {
            try {
                // Show loading
                document.getElementById('content').innerHTML = '<div class="loading">Laden...</div>';
                
                // Fetch statistics
                const statsResponse = await fetch('/usage/stats');
                if (!statsResponse.ok) throw new Error('Failed to fetch stats');
                const stats = await statsResponse.json();
                
                // Fetch recent requests
                const requestsResponse = await fetch('/usage/requests?limit=20');
                if (!requestsResponse.ok) throw new Error('Failed to fetch requests');
                const requests = await requestsResponse.json();
                
                // Render the page
                renderStats(stats, requests);
                
                // Update last updated time
                const now = new Date().toLocaleString('de-DE');
                document.getElementById('lastUpdated').textContent = `Zuletzt aktualisiert: ${now}`;
                
            } catch (error) {
                console.error('Error loading stats:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <strong>❌ Fehler beim Laden der Statistiken</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }
        
        function renderStats(stats, requests) {
            const html = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">📈</div>
                        <div class="stat-label">Gesamt Anfragen</div>
                        <div class="stat-value">${stats.total_requests.toLocaleString()}</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon">🪙</div>
                        <div class="stat-label">Gesamt Tokens</div>
                        <div class="stat-value">${stats.total_tokens.toLocaleString()}</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon">📅</div>
                        <div class="stat-label">Anfragen Heute</div>
                        <div class="stat-value">${stats.requests_today.toLocaleString()}</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon">💰</div>
                        <div class="stat-label">Tokens Heute</div>
                        <div class="stat-value">${stats.tokens_today.toLocaleString()}</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon">📆</div>
                        <div class="stat-label">Anfragen Monat</div>
                        <div class="stat-value">${stats.requests_this_month.toLocaleString()}</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon">💸</div>
                        <div class="stat-label">Tokens Monat</div>
                        <div class="stat-value">${stats.tokens_this_month.toLocaleString()}</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon">❌</div>
                        <div class="stat-label">Fehlgeschlagen</div>
                        <div class="stat-value">${stats.failed_requests.toLocaleString()}</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon">✅</div>
                        <div class="stat-label">Erfolgsrate</div>
                        <div class="stat-value">
                            ${stats.total_requests > 0 
                                ? Math.round((stats.total_requests - stats.failed_requests) / stats.total_requests * 100) 
                                : 100}%
                        </div>
                    </div>
                </div>
                
                <div class="recent-requests">
                    <h2>📝 Letzte 20 Anfragen</h2>
                    ${requests.map(req => `
                        <div class="request-item">
                            <div class="request-info">
                                <div class="request-endpoint">${req.endpoint}</div>
                                <div class="request-meta">
                                    ${req.model} • ${new Date(req.created_at).toLocaleString('de-DE')}
                                    ${req.error_message ? `<br><span style="color: #e74c3c;">Fehler: ${req.error_message}</span>` : ''}
                                </div>
                            </div>
                            <div class="request-tokens ${req.request_successful ? 'request-success' : 'request-failed'}">
                                ${req.tokens_used || 0} tokens
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            document.getElementById('content').innerHTML = html;
        }
        
        // Load stats on page load
        window.addEventListener('DOMContentLoaded', loadStats);
        
        // Auto-refresh every 30 seconds
        setInterval(loadStats, 30000);
    </script>
</body>
</html>
