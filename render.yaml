services:
  - type: web
    name: tali-service-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: tali-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: LEXWARE_API_KEY
        sync: false
      - key: MOCK_LEXWARE
        value: false

databases:
  - name: tali-db
    plan: free
    databaseName: tali_service_agent
    user: tali_user
